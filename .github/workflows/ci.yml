name: ci

# Merge gate (issue #485). main was silently uncompilable for ~5 days
# (#480 → #484) because nothing ran `cargo build` on PRs. These are the exact
# checks that were being run by hand; now they block merge.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref cancels the in-flight run — saves runner minutes
# on rapid pushes without losing coverage of the final commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NB: deliberately NOT setting `RUSTFLAGS: -D warnings` — that leaks to
  # dependency crates and would fail CI on an upstream's stray warning. The
  # workspace `[workspace.lints] warnings = "deny"` already denies warnings
  # for OUR crates (the correct scope, and exactly #484's class of break).

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # PUBLIC-REPO guard: fail in seconds (no toolchain needed) if any private
      # infra / deploy / client / data-provider term leaked into a tracked file.
      # See scripts/check-upstream-clean.sh + CLAUDE.md "Repo Boundaries".
      # (scripts/ci-steps.sh runs it again a few steps down — it is 2 s, and
      # running it FIRST means a leak fails before we pay for a toolchain.)
      - name: upstream-clean (no infra/provider/client leaks)
        run: bash scripts/check-upstream-clean.sh

      # Pin to the repo's rust-version (Cargo.toml `rust-version = "1.95"`,
      # edition 2024). Bump both together.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      # No `protoc` step (#574). It used to be here because `gtfs-rt` ran
      # `prost-build` at build time; the GTFS-Realtime bindings are now
      # generated ahead of time and committed, so nothing in the build shells
      # out to a protobuf compiler. `scripts/gen-gtfs-rt.sh` still needs it,
      # but that runs by hand, only when the (frozen) spec moves.

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # THE step list lives in scripts/ci-steps.sh (issue #555) and is ALSO what
      # scripts/hooks/pre-push runs — one definition, so the local hook and this
      # workflow cannot drift. It runs, in order:
      #   upstream-clean · rustfmt --check · clippy (all targets, all features)
      #   · test --workspace (lib AND route/tests/*.rs; it also links
      #   butterfly-route and butterfly-dl, so there is no separate build step
      #   — #591. The container-backed tests are #[ignore] or probe for data/
      #   plus the opt-in $BUTTERFLY_TEST_DATA_DIR and self-skip, so no 24 GB
      #   artifact is needed) · test --workspace --all-features (#556: the
      #   `feature = "bench"`-gated tests; this is also what links the
      #   bench-only butterfly-bench) · a count guard proving the all-features
      #   test list is a strict superset of the default one · py_compile of the
      #   post-deploy gate · the gate's --list-gates registry smoke.
      # Each step is wrapped in a ::group:: so the log stays readable.
      - name: ci steps (fmt, clippy, tests, post-deploy gate)
        run: bash scripts/ci-steps.sh
