[workspace]
resolver = "2"
members = [
    "butterfly-common",
    "dl",
    "route",
]

[workspace.package]
version = "2.0.0"
authors = ["Pierre <pierre@warnier.net>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/butterfly-osm/butterfly-osm"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
tokio = { version = "1.51", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0.18"
env_logger = "0.11.10"
indicatif = "0.18"
strsim = "0.11.1"
tempfile = "3.27"
# `toml` is API-stable across 0.8 → 1.x for our schema-parsing
# workload (TOML region indexes + country packs). Pinning workspace-
# wide so dl/route all link the same crate version.
toml = "1.1"
# Dev dependencies
wiremock = "0.6.5"
ctor = "0.10"

[profile.release]
# #573: the release binary shipped 7.6 MB of symbol table (.symtab/.strtab —
# 55.6 MB → 48.0 MB for butterfly-route). Nothing at run time reads it: the
# server's own diagnostics are the panic location (`file:line`, a &'static str
# in .rodata, untouched by stripping), the panic message, and anyhow's context
# chain — all of which survive. What stripping DOES cost is symbol names in a
# `RUST_BACKTRACE` dump, which is why the escape hatch below exists rather
# than being an argument for shipping the symbols to every container forever.
#
# `lto`/`codegen-units` are deliberately NOT set: they trade build wall time
# for a few percent of run time, and this ticket is about build and image
# cost, not code generation.
strip = "symbols"

# Same optimisation, same behaviour, symbols kept — for when you need named
# frames in a backtrace:  cargo build --profile release-debug
# The binary lands in `target/release-debug/`, so it never overwrites the
# shipped artifact.
[profile.release-debug]
inherits = "release"
strip = "none"
debug = 1

[workspace.lints.rust]
# Ship-readiness policy: every warning is a build failure. `warnings = "deny"`
# already covers `dead_code`, `unused_*`, etc., but we name the ones the audit
# called out explicitly so they're not silently relaxed by a future edit.
warnings = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"
# `unsafe_code` is denied workspace-wide. **Sole carveout: the
# memory-mapping kernel surface** — `memmap2::Mmap::map` (file's bytes
# can mutate from outside the process; Rust can't prove the lifetime
# contract) and `libc::madvise` against ranges of those mappings (same
# subsystem, same lifetime story — the mapping must outlive the call).
# Both live behind narrowly-scoped `#[allow(unsafe_code)]` wrappers
# with documented SAFETY blocks (typically in `formats/mmap.rs`).
# The safety guarantee comes from how we use them: file-backed,
# read-only, Arc-owned, slices borrowed through accessor methods.
# Everything else stays denied — no shared raw pointer tricks, no
# `unsafe impl Send/Sync`, no inline-asm.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_closure = "allow"
