# Butterfly region index — Belgium
#
# Every file butterfly-route needs for Belgium. Fetched in parallel
# by `butterfly-dl belgium` with extension-based verification
# (magic prefix + min-bytes + sha256 sidecar + atomic .tmp → rename).
#
# Canonical target paths under the region's data root
# (default: `./data/belgium`):
#
#   belgium.pbf                                ← [pbf]
#   transit/gtfs/sncb.zip                      ← [[gtfs]] id = "sncb"
#   transit/gtfs/delijn.zip                    ← [[gtfs]] id = "delijn"
#   transit/gtfs/tec.zip                       ← [[gtfs]] id = "tec"
#   transit/netex/stib-epip.xml                ← [[netex_epip]] id = "stib"
#
# This matches the layout butterfly-route's server already loads
# from — no migration, no config change downstream.

[pbf]
url = "https://download.geofabrik.de/europe/belgium-latest.osm.pbf"

[[gtfs]]
id  = "sncb"
url = "https://gtfs.irail.be/nmbs/gtfs/latest.zip"

[[gtfs]]
id  = "delijn"
# #537: the mirror grew a stable `_latest/` alias, refreshed daily. The
# dated-file wildcard it replaces (#498) only ever resolved against a
# directory listing, which the transit fetcher does not do — so this list
# and butterfly-route's default feed set disagreed, and the route side kept
# requesting the long-dead iRail path. One URL, resolvable by both.
# Probed 2026-09-04: 200, ~196 MB, Last-Modified same day.
url = "https://gtfs.flatturtle.cloud/delijn/_latest/delijn-gtfs.zip"

[[gtfs]]
id  = "tec"
url = "https://opendata.tec-wl.be/Current%20GTFS/TEC-GTFS.zip"

[[netex_epip]]
id  = "stib"
# This is what the national access point publishes for this dataset as of
# 2026-09-04 — and it answers 404. Probed the same day: the portal's
# resource URL is unchanged, the publisher's blob is gone, and the
# container itself does not list. There is no replacement to point at, so
# the URL stays as published and the fetch fails loudly and by name
# rather than quietly leaving the timetable a feed short (#537).
url = "https://belgianmobility.blob.core.windows.net/epip-production/epip-stibmivb-bmc-latest.xml"
