[package]
# Not published on crates.io since 2.0.0 (2026-10-13): the toolkit is
# distributed from GitHub and as container images; a stale crate misleads.
publish = false
name = "butterfly-dl"
version.workspace = true
description = "Butterfly-dl - Optimized OpenStreetMap data downloader with HTTP support"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json", "gzip", "brotli", "stream", "rustls"] }
clap.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strsim.workspace = true
tokio.workspace = true
anyhow = "1.0.102"
indicatif.workspace = true
log = "0.4.29"
env_logger.workspace = true
futures = "0.3.32"
tokio-util = { version = "0.7.18", features = ["io"] }
sha2 = "0.11"
hex = "0.4.3"
toml.workspace = true


[dev-dependencies]
tempfile.workspace = true
ctor.workspace = true
wiremock.workspace = true
