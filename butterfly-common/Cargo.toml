[package]
# Not published on crates.io since 2.0.0 (2026-10-13): the toolkit is
# distributed from GitHub and as container images; a stale crate misleads.
publish = false
name = "butterfly-common"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Common utilities for the butterfly-osm toolkit"
keywords = ["osm", "openstreetmap", "utilities"]
categories = ["api-bindings", "data-structures"]

[dependencies]
thiserror.workspace = true
strsim.workspace = true
reqwest = { workspace = true, optional = true }

[lints]
workspace = true

[features]
default = []
http = ["reqwest"]
